name: RootHide 64e test package
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Show toolchain
        run: |
          xcode-select -p
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-path
      - name: Prepare Metal toolchain when required
        run: |
          if ! xcrun --sdk iphoneos metal -v; then
            xcodebuild -downloadComponent MetalToolchain
          fi
      - name: Build only genuine arm64e package
        run: python3 tools/build.py
      - name: Upload test package and verification
        uses: actions/upload-artifact@v4
        with:
          name: TheseusKeyboard-0.1.0-test3-arm64e
          path: dist/
          if-no-files-found: error
